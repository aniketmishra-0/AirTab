<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AirTab - Floating Mini Browser</title>
  <link rel="icon" type="image/png" href="icons/icon48.png" />
  <style>
    :root {
      --bg: #0d0f14;
      --header-bg: rgba(22, 24, 32, 0.88);
      --card-bg: rgba(26, 29, 40, 0.95);
      --border: rgba(255, 255, 255, 0.12);
      --text: #f5f5f7;
      --text-muted: #8e95a5;
      --accent: #007aff;
      --accent-glow: rgba(0, 122, 255, 0.35);
      --tab-bg: rgba(255, 255, 255, 0.06);
      --tab-active: rgba(255, 255, 255, 0.14);
      --omnibox-bg: rgba(15, 17, 23, 0.75);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, sans-serif;
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    /* 1. Header Bar: Multi-Tabs & Window Controls */
    .airtab-header {
      height: 40px;
      min-height: 40px;
      background: var(--header-bg);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 10px;
      gap: 8px;
      -webkit-app-region: drag;
    }

    .tabs-track {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
      -webkit-app-region: no-drag;
    }
    .tabs-track::-webkit-scrollbar {
      display: none;
    }

    .tab-item {
      height: 28px;
      padding: 0 10px;
      background: var(--tab-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.18s ease;
      max-width: 160px;
      min-width: 80px;
      flex-shrink: 0;
    }
    .tab-item:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text);
    }
    .tab-item.active {
      background: var(--tab-active);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.22);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    }
    .tab-title {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tab-close {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: var(--text-muted);
      cursor: pointer;
      line-height: 1;
    }
    .tab-close:hover {
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
    }

    .add-tab-btn {
      width: 26px;
      height: 26px;
      background: var(--tab-bg);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.15s ease;
      flex-shrink: 0;
      -webkit-app-region: no-drag;
    }
    .add-tab-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.28);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      -webkit-app-region: no-drag;
    }

    .action-btn {
      height: 26px;
      padding: 0 8px;
      background: var(--tab-bg);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11.5px;
      font-weight: 550;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .action-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: var(--text);
    }
    .action-btn.active {
      background: rgba(0, 122, 255, 0.22);
      border-color: var(--accent);
      color: #38bdf8;
      box-shadow: 0 0 10px var(--accent-glow);
    }
    .action-btn svg {
      width: 12px;
      height: 12px;
    }

    /* 2. Omnibox Navigation Bar */
    .airtab-nav-bar {
      height: 42px;
      min-height: 42px;
      background: rgba(18, 20, 28, 0.95);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 10px;
      gap: 6px;
    }

    .nav-btn {
      width: 28px;
      height: 28px;
      background: transparent;
      border: none;
      border-radius: 7px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s;
    }
    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text);
    }
    .nav-btn svg {
      width: 13px;
      height: 13px;
    }

    .omnibox-wrapper {
      flex: 1;
      height: 30px;
      background: var(--omnibox-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      align-items: center;
      padding: 0 10px;
      gap: 8px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .omnibox-wrapper:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-glow);
    }

    .omnibox-icon {
      color: var(--text-muted);
      display: flex;
      align-items: center;
    }
    .omnibox-icon svg {
      width: 12px;
      height: 12px;
    }

    .omnibox-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
    }
    .omnibox-input::placeholder {
      color: rgba(255, 255, 255, 0.35);
    }

    .omnibox-badge {
      font-size: 11px;
      font-weight: 600;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.12);
      padding: 2px 6px;
      border-radius: 4px;
      display: none;
    }

    /* 3. Viewport Container */
    .viewport-container {
      flex: 1;
      position: relative;
      background: #000;
      overflow: hidden;
    }

    iframe.tab-iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: none;
      background: #ffffff;
    }
    iframe.tab-iframe.active {
      display: block;
    }

    /* Status Toast */
    .status-toast {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(20, 22, 30, 0.92);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      padding: 7px 16px;
      border-radius: 20px;
      font-size: 12.5px;
      font-weight: 500;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      opacity: 0;
      pointer-events: none;
      transition: all 0.22s ease;
      z-index: 999;
    }
    .status-toast.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <!-- Header Bar -->
  <header class="airtab-header">
    <div class="tabs-track" id="tabsTrack"></div>
    <button class="add-tab-btn" id="addTabBtn" title="New Tab (Cmd+T)">+</button>

    <div class="header-actions">
      <!-- Always on Front Button -->
      <button class="action-btn" id="alwaysOnFrontBtn" title="Pin Always on Front (Document PiP — Stays on top of all windows)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="17" x2="12" y2="22"></line>
          <path d="M5 17h14v-2l-2-2V5a2 2 0 0 0-2-2H9a2 2 0 0 0-2 2v8l-2 2v2z"></path>
        </svg>
        <span>Always on Front</span>
      </button>

      <!-- Fullscreen Button -->
      <button class="action-btn" id="fullscreenBtn" title="Toggle Fullscreen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 3 21 3 21 9"></polyline>
          <polyline points="9 21 3 21 3 15"></polyline>
          <line x1="21" y1="3" x2="14" y2="10"></line>
          <line x1="3" y1="21" x2="10" y2="14"></line>
        </svg>
      </button>
    </div>
  </header>

  <!-- Navigation Bar -->
  <nav class="airtab-nav-bar">
    <button class="nav-btn" id="backBtn" title="Back (Alt+Left)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </button>
    <button class="nav-btn" id="forwardBtn" title="Forward (Alt+Right)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
    </button>
    <button class="nav-btn" id="reloadBtn" title="Reload (Cmd+R)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"></polyline>
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
      </svg>
    </button>
    <button class="nav-btn" id="homeBtn" title="Home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
    </button>

    <!-- Omnibox -->
    <div class="omnibox-wrapper">
      <span class="omnibox-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </span>
      <input type="text" class="omnibox-input" id="omnibox" placeholder="Search Google or enter web address..." autocomplete="off" spellcheck="false" />
      <span class="omnibox-badge" id="hostBadge">google.com</span>
    </div>
  </nav>

  <!-- Viewport -->
  <main class="viewport-container" id="viewport"></main>

  <!-- Toast -->
  <div class="status-toast" id="toast"></div>

  <script src="window.js"></script>
</body>
</html>
