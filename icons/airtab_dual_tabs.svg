<svg xmlns="http://www.w3.org/2000/svg" viewBox="6 10 116 106" width="128" height="128">
  <defs>
    <!-- Background tab (representing parent browser page) -->
    <linearGradient id="backTabGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    
    <!-- Foreground elevated floating AirTab -->
    <linearGradient id="frontTabGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="50%" stop-color="#007aff"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    
    <!-- Luminous accent bar -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    
    <!-- Clean tight drop shadow -->
    <filter id="tightGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#007aff" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#tightGlow)">
    <!-- Back Tab: Base Browser Window -->
    <rect x="18" y="38" width="74" height="66" rx="14" 
          fill="url(#backTabGrad)" stroke="#64748b" stroke-width="2"/>
          
    <!-- Back Tab Mock Header & Text lines -->
    <circle cx="28" cy="48" r="2.5" fill="#64748b"/>
    <circle cx="36" cy="48" r="2.5" fill="#475569"/>
    <line x1="26" y1="64" x2="48" y2="64" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="26" y1="76" x2="40" y2="76" stroke="#334155" stroke-width="2" stroke-linecap="round"/>

    <!-- Front Tab: Elevated Floating Popover Tab -->
    <rect x="44" y="22" width="68" height="72" rx="16" 
          fill="url(#frontTabGrad)" stroke="#e0f2fe" stroke-width="2"/>
          
    <!-- Sleek mini tab bar header for the floating tab -->
    <path d="M 44 38 L 112 38" stroke="#93c5fd" stroke-width="1.5" stroke-opacity="0.4"/>
    <circle cx="54" cy="30" r="2" fill="#ffffff" opacity="0.9"/>
    <circle cx="61" cy="30" r="2" fill="#ffffff" opacity="0.6"/>
    <rect x="68" y="27" width="38" height="6" rx="3" fill="#ffffff" opacity="0.35"/>
          
    <!-- Stylized Modern 'A' Glyph in Floating Tab -->
    <!-- Apex & Legs of 'A' -->
    <path d="M 78 46 L 93 72 L 85 72 L 78 59 L 71 72 L 63 72 Z" fill="#ffffff"/>
    
    <!-- Luminous Crossbar Pill -->
    <rect x="56" y="76" width="44" height="7" rx="3.5" fill="url(#accentGrad)"/>
  </g>
</svg>